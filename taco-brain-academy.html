<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taco Brain Academy</title>
<style>
:root{color-scheme:light dark;--bg:#17120d;--panel:#241b14;--text:#fff7ed;--muted:#c9b8a7;--border:#5a4634;--accent:#fb923c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{min-height:100vh;background:var(--bg);padding:24px 16px 40px}main{max-width:760px;margin:auto}.hero{text-align:center;margin-bottom:18px}.hero h1{font-size:clamp(30px,7vw,46px);margin:0 0 6px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px}.stat{text-align:center}.big{font-size:28px;font-weight:850}.small{font-size:13px;color:var(--muted)}.question{font-size:22px;font-weight:800;line-height:1.35;margin-bottom:16px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:50px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--text);font-weight:750;font-size:16px;cursor:pointer;padding:10px 14px}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.correct{outline:3px solid #22c55e}.wrong{outline:3px solid #ef4444}.feedback{text-align:center;min-height:28px;font-weight:800;padding-top:12px}.upgrades{display:grid;gap:10px}.upgrade{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.upgrade h3{margin:0 0 4px}.upgrade p{margin:0;color:var(--muted);font-size:13px}.tax{margin-top:12px}.bar{height:9px;background:#3b2b20;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s}.win{text-align:center;padding:30px 12px}.trophy{font-size:70px}.confetti{position:fixed;left:50%;top:35%;width:9px;height:14px;border-radius:2px;z-index:9999;pointer-events:none;animation:fall 1.25s ease-out forwards}@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}.restart{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:0}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#17120d;color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;z-index:10000}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.answers{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"><main><section class="hero"><h1>🌮 Taco Brain Academy</h1><p id="subtitle">Choose your grade, answer math questions, earn tacos, buy upgrades, and build your taco empire!</p></section><div id="game"></div></main></div>
<script>
(()=>{
const gradeQs={
6:[
['What is 5 + 7?',['10','12','13','15'],1],['What is 10 - 4?',['4','5','6','7'],2],['What is 3 × 4?',['7','10','12','14'],2],['What is 20 ÷ 5?',['2','4','5','10'],1],['What is 25% of 100?',['10','20','25','50'],2],['What is 8 + 6?',['12','14','15','16'],1],['What is 15 - 7?',['6','7','8','9'],2],['What is 5 × 5?',['15','20','25','30'],2],['What is 18 ÷ 3?',['5','6','7','8'],1],['What is half of 20?',['5','10','15','20'],1],['What is 9 + 9?',['16','17','18','19'],2],['What is 20 - 8?',['10','11','12','13'],2],['What is 4 × 6?',['20','22','24','26'],2],['What is 30 ÷ 5?',['4','5','6','7'],2],['What is 10% of 50?',['5','10','15','20'],0]
],
7:[
['What is 7 × 8?',['48','54','56','64'],2],['What is 72 ÷ 9?',['6','7','8','9'],2],['What is 45 + 38?',['73','83','93','103'],1],['What is 100 - 47?',['43','53','63','73'],1],['What is 3/4 of 20?',['10','12','15','18'],2],['What is 25% of 80?',['15','20','25','30'],1],['What is 2.5 + 1.5?',['3','4','5','6'],1],['What is 6²?',['12','18','36','42'],2],['What is 5 × 12?',['50','55','60','65'],2],['What is 144 ÷ 12?',['10','11','12','13'],2],['What is 15% of 100?',['10','15','20','25'],1],['What is 2/5 of 25?',['5','10','15','20'],1],['What is 3 × (4 + 2)?',['12','18','20','24'],1],['What is 90 ÷ 6?',['12','15','18','20'],1],['What is 0.5 × 10?',['2','5','10','15'],1]
],
8:[
['What is 12 × 7?',['72','84','96','98'],1],['What is 144 ÷ 12?',['10','11','12','14'],2],['What is 3² + 4²?',['12','20','25','49'],2],['What is 15% of 200?',['20','25','30','35'],2],['Solve: x + 7 = 15',['6','7','8','9'],2],['Solve: 3x = 21',['5','6','7','8'],2],['What is 2/3 of 30?',['10','15','20','25'],2],['What is 2.5 × 4?',['8','10','12','14'],1],['What is 5² - 3²?',['12','16','20','22'],1],['What is 18 + 27 × 2?',['72','81','90','99'],1],['What is the slope of y = 2x + 3?',['2','3','5','6'],0],['Solve: 2x + 4 = 14',['4','5','6','7'],1],['What is 0.75 as a fraction?',['1/2','2/3','3/4','4/5'],2],['What is 30% of 150?',['30','40','45','50'],2],['What is 5 × (8 - 3)?',['20','25','30','35'],1]
]};
let grade=null,qs=[],tacos=0,qi=0,upgradeLevels=Array(20).fill(0),workersShop=false,workerLevels=Array(10).fill(0),admin=false,done=false,lastTax=Date.now(),taxMs=90000,btc=0,btcCash=1000,btcPrice=50000,btcHistory=[50000],policeActive=false,policeTimer=null;
const game=document.getElementById('game');
const saveKey='tacoBrainAcademySave';
function saveGame(){if(grade===null||done)return;localStorage.setItem(saveKey,JSON.stringify({grade,qi,tacos,upgradeLevels,workersShop,workerLevels,admin,btc,btcCash,btcPrice,btcHistory,lastTax:Date.now()-(Date.now()-lastTax)}));toast('💾 Game saved!')}
function loadGame(){let raw=localStorage.getItem(saveKey);if(!raw){toast('📂 No saved game found');return}try{let s=JSON.parse(raw);if(!gradeQs[s.grade]||!Array.isArray(s.upgradeLevels)||!Array.isArray(s.workerLevels))throw Error();grade=s.grade;qs=gradeQs[grade];qi=Math.max(0,Number(s.qi)||0);tacos=Number(s.tacos)||0;upgradeLevels=Array(20).fill(0).map((_,i)=>Math.max(0,Number(s.upgradeLevels[i])||0));workersShop=!!s.workersShop;workerLevels=Array(10).fill(0).map((_,i)=>Math.max(0,Number(s.workerLevels[i])||0));admin=!!s.admin;done=false;btc=Math.max(0,Number(s.btc)||0);btcCash=Math.max(0,Number(s.btcCash)||0);btcPrice=Math.max(1000,Number(s.btcPrice)||50000);btcHistory=Array.isArray(s.btcHistory)&&s.btcHistory.length?s.btcHistory.slice(-20):[btcPrice];lastTax=Date.now()-(Date.now()-Number(s.lastTax||Date.now()));document.getElementById('subtitle').textContent='Grade '+grade+' math • Earn tacos, buy upgrades, and build your taco empire!';render();toast('📂 Game loaded!')}catch(e){toast('❌ Save file is invalid')}}
const upgradeData=[['🌮 Taco Starter',10,1],['⚡ Taco Booster',25,2],['🥤 Taco Drink Stand',50,3],['🍽️ Taco Restaurant',100,4],['🚚 Taco Food Truck',200,5],['🏪 Taco Shop',350,6],['🏙️ Taco Plaza',600,8],['🌮 Taco Factory',1000,10],['👑 Taco Kingdom',1750,15],['🌎 Taco Empire',3000,25],['🌮 Taco Mega Shop',5000,35],['🔥 Taco Super Factory',7500,45],['💎 Taco Diamond Diner',10000,60],['🚀 Taco Space Cafe',14000,80],['🏰 Taco Castle',19000,105],['🌋 Taco Volcano',25000,135],['🌌 Taco Galaxy',32000,170],['🪐 Taco Planet',40000,210],['👽 Taco Universe',50000,260],['♾️ Taco Infinity',65000,325]];
const workerData=[['👶 Taco Rookie',250,3],['🧑‍🍳 Taco Chef',750,8],['🚚 Taco Driver',1500,15],['👨‍🔧 Taco Builder',3000,25],['🧪 Taco Scientist',6000,40],['🤖 Taco Robot',10000,60],['🦾 Taco Mega Robot',16000,90],['🚀 Taco Space Worker',25000,130],['👑 Taco Boss',40000,200],['🌮 Taco Legend',60000,300]];
const income=()=>1+upgradeLevels.reduce((sum,lvl,i)=>sum+lvl*upgradeData[i][2],0);
const passiveRate=()=>workerLevels.reduce((sum,lvl,i)=>sum+lvl*workerData[i][2],0);
const goal=300000;
const adminCode='BETAISSTINKY';
function confetti(n=45){for(let i=0;i<n;i++){let d=document.createElement('i');d.className='confetti';d.style.background=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'][Math.floor(Math.random()*6)];d.style.setProperty('--dx',((Math.random()-.5)*innerWidth*.9)+'px');d.style.setProperty('--dy',(180+Math.random()*innerHeight*.55)+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function schedulePolice(){clearTimeout(policeTimer);if(done||grade===null)return;policeTimer=setTimeout(()=>{if(!done&&grade!==null){policeActive=true;render();toast('🚔 Police inspection!');}},(180+Math.random()*60)*1000)}
function policeComply(){policeActive=false;toast('👮 Inspection complete. You complied!');render();schedulePolice()}
function policeTicket(){policeActive=false;tacos-=25;toast('🎫 Ticket issued: -25 tacos');if(tacos<=-20){tacos=-20;done=true}render();if(!done)schedulePolice()}
function render(){
 if(grade===null){game.innerHTML='<div class="card" style="text-align:center"><h2>🔐 Admin Code</h2><p class="small" style="font-size:16px;margin-bottom:12px">Enter the admin code or leave it blank to play normally.</p><input id="adminInput" class="btn" style="width:100%;text-align:center" placeholder="Enter admin code"><button class="btn" id="adminBtn" style="margin-top:10px;width:100%">Continue</button><div id="adminMsg" class="feedback"></div><h2 style="margin-top:22px">📚 Choose Your Grade</h2><div class="answers"><button class="btn" id="g6">Grade 6</button><button class="btn" id="g7">Grade 7</button><button class="btn" id="g8">Grade 8</button></div><div class="upgrade" style="margin-top:14px"><button class="btn" id="loadGame">📂 Load Saved Game</button><button class="btn" id="deleteSave">🗑️ Delete Save</button></div></div>';document.getElementById('adminBtn').onclick=()=>{let v=document.getElementById('adminInput').value.trim();if(v===adminCode){admin=true;document.getElementById('adminMsg').textContent='👑 Admin mode enabled! Upgrades are free.';document.getElementById('adminInput').value='';}else if(v){document.getElementById('adminMsg').textContent='❌ Wrong admin code.'}else{document.getElementById('adminMsg').textContent='Admin mode not enabled.'}};document.getElementById('g6').onclick=()=>startGrade(6);document.getElementById('g7').onclick=()=>startGrade(7);document.getElementById('g8').onclick=()=>startGrade(8);document.getElementById('loadGame').onclick=loadGame;document.getElementById('deleteSave').onclick=()=>{localStorage.removeItem(saveKey);toast('🗑️ Saved game deleted')};return}
 if(done){game.innerHTML='<div class="card win"><div class="trophy">🏆🌮</div><h2>You completed the Taco Empire!</h2><p>You reached the 300,000-taco goal. The taco kingdom is yours!</p><div class="big">Final tacos: '+Math.floor(tacos)+' 🌮</div><button class="btn restart" id="restart">Play Again</button><button class="btn" id="mainMenu" style="width:100%;margin-top:10px">↩️ Return to Main Menu</button></div>';document.getElementById('restart').onclick=reset;document.getElementById('mainMenu').onclick=mainMenu;return}
 if(policeActive){game.innerHTML='<div class="card" style="text-align:center"><div style="font-size:65px">🚔👮</div><h2>Police Inspection</h2><p>The police came to see what you are doing at Taco Brain Academy.</p><p><b>Will you comply with the inspection?</b></p><div class="answers"><button class="btn" id="comply">👮 Comply</button><button class="btn" id="refuse">❌ Do Not Comply</button></div><p class="small" style="margin-top:12px">If you do not comply, you receive a 25-taco ticket.</p></div>';document.getElementById('comply').onclick=policeComply;document.getElementById('refuse').onclick=policeTicket;return}
 const q=qs[qi%qs.length];
 const upgrades=upgradeData.map(u=>[u[0],u[1],'+'+u[2]+' tacos per correct answer']);
 game.innerHTML='<div class="stats"><div class="card stat"><div class="big">🌮 '+Math.floor(tacos)+'</div><div class="small">Tacos</div></div><div class="card stat"><div class="big">❓ '+(qi+1)+'</div><div class="small">Question</div></div><div class="card stat"><div class="big">+'+income()+' 🌮</div><div class="small">Per correct answer</div></div></div><div class="card"><div class="question">'+q[0]+'</div><div class="answers">'+q[1].map((a,i)=>'<button class="btn answer" data-i="'+i+'">'+a+'</button>').join('')+'</div><div id="feedback" class="feedback" aria-live="polite"></div></div><div class="card" style="margin-top:12px"><h2 style="margin:0 0 12px">🏪 Taco Empire Upgrades '+(admin?'👑 ADMIN MODE':'')+'</h2><div class="upgrades">'+upgrades.map((u,i)=>'<div class="upgrade"><div><h3>'+u[0]+' ×'+upgradeLevels[i]+'</h3><p>'+u[1]+' tacos • '+u[2]+'</p></div><button class="btn upgradeBtn" data-u="'+i+'" '+(!admin&&tacos<u[1]?'disabled':'')+'>'+(admin?'FREE UPGRADE':'Buy for '+u[1]+' 🌮')+'</button></div>').join('')+'</div></div><div class="card" style="margin-top:12px"><h2 style="margin:0 0 12px">👷 Workers Shop</h2><div class="upgrade"><div><h3>👷 Unlock Workers Shop</h3><p>500 tacos • Unlocks 10 worker types</p></div><button class="btn" id="workerShop" '+(workersShop||(!admin&&tacos<500)?'disabled':'')+'>'+(workersShop?'Unlocked':'Unlock for '+(admin?'FREE':'500 🌮'))+'</button></div>'+(!workersShop?'':'<div class="upgrades" style="margin-top:10px">'+workerData.map((w,i)=>'<div class="upgrade"><div><h3>'+w[0]+' ×'+workerLevels[i]+'</h3><p>'+w[1]+' tacos • +'+w[2]+' tacos every second</p></div><button class="btn workerBtn" data-w="'+i+'" '+(!admin&&tacos<w[1]?'disabled':'')+'>'+(admin?'HIRE FREE':'Hire for '+w[1]+' 🌮')+'</button></div>').join('')+'</div>')+'</div><div class="card" style="margin-top:12px"><h2 style="margin:0 0 12px">₿ Bitcoin Market</h2><p class="small">Simulated in-game market. Buy and sell Bitcoin with your taco cash.</p><div class="stats"><div class="card stat"><div class="big">$'+Math.floor(btcPrice).toLocaleString()+'</div><div class="small">BTC price</div></div><div class="card stat"><div class="big">₿ '+btc.toFixed(4)+'</div><div class="small">Your Bitcoin</div></div><div class="card stat"><div class="big">$'+Math.floor(btcCash).toLocaleString()+'</div><div class="small">Market cash</div></div></div><div class="upgrade"><button class="btn" id="buyBtc">Buy ₿0.001</button><button class="btn" id="sellBtc" '+(btc<=0?'disabled':'')+'>Sell ₿0.001</button></div><div class="small" style="margin-top:8px">Market moves every few seconds. This is only a game market and uses fake cash.</div></div><div class="card tax"><b>💰 Taxes: 4 tacos every 1 minute 30 seconds</b><div id="timer" class="small" style="margin-top:5px"></div><div class="bar"><span id="bar"></span></div><div class="small" style="margin-top:7px">Workers currently earn +'+passiveRate()+' tacos per second.</div><button class="btn" id="mainMenu" style="width:100%;margin-top:12px">↩️ Return to Main Menu</button></div>';
 document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 document.querySelectorAll('.upgradeBtn').forEach(b=>b.onclick=()=>{let i=+b.dataset.u,u=upgrades[i];if(admin||tacos>=u[1]){if(!admin)tacos-=u[1];upgradeLevels[i]++;render()}});
 document.getElementById('workerShop').onclick=()=>{if(!workersShop&&(admin||tacos>=500)){if(!admin)tacos-=500;workersShop=true;render()}};
 if(workersShop)document.querySelectorAll('.workerBtn').forEach(b=>b.onclick=()=>{let i=+b.dataset.w,w=workerData[i];if(admin||tacos>=w[1]){if(!admin)tacos-=w[1];workerLevels[i]++;toast(w[0]+' hired! +'+w[2]+' tacos per second');render()}});
 document.getElementById('buyBtc').onclick=()=>{let cost=btcPrice*0.001;if(btcCash>=cost){btcCash-=cost;btc+=0.001;render()}else toast('💸 Not enough market cash')};
 document.getElementById('sellBtc').onclick=()=>{if(btc>=0.001){btc-=0.001;btcCash+=btcPrice*0.001;render()}};
 document.getElementById('mainMenu').onclick=mainMenu;
 const saveButton=document.createElement('button');saveButton.className='btn';saveButton.textContent='💾 Save Game';saveButton.style.cssText='width:100%;margin-top:10px';saveButton.onclick=saveGame;document.getElementById('mainMenu').parentElement.appendChild(saveButton);
 updateTimer();
}
function startGrade(g){grade=g;qs=gradeQs[g];lastTax=Date.now();document.getElementById('subtitle').textContent='Grade '+g+' math • Earn tacos, buy upgrades, and build your taco empire!';render();schedulePolice()}
function answer(i){let q=qs[qi%qs.length],bs=document.querySelectorAll('.answer');bs.forEach(b=>b.disabled=true);if(i===q[2]){tacos+=income();bs[i].classList.add('correct');document.getElementById('feedback').textContent='🎉 Correct! +'+income()+' tacos!';if(tacos>=goal){tacos=goal;done=true;confetti(100)}else confetti(50)}else{bs[i].classList.add('wrong');bs[q[2]].classList.add('correct');document.getElementById('feedback').textContent='❌ Not quite. Correct answer: '+q[1][q[2]]}qi++;setTimeout(render,850)}
function updateTimer(){if(done)return;let left=Math.max(0,taxMs-(Date.now()-lastTax));let s=Math.ceil(left/1000);let t=document.getElementById('timer'),b=document.getElementById('bar');if(t){t.textContent=s+' seconds until tax is due';b.style.width=((1-left/taxMs)*100)+'%'}}
function taxes(){if(done)return;let now=Date.now(),n=Math.floor((now-lastTax)/taxMs);if(n>0){for(let i=0;i<n;i++){if(tacos>=4){tacos-=4;toast('💰 Tax paid: -4 tacos')}else{tacos-=5;toast('⚠️ Tax unpaid: -5 tacos');if(tacos<=-20){tacos=-20;done=true;toast('💀 You reached -20 tacos! Game over!');setTimeout(render,700);break}}}lastTax+=n*taxMs;render()}}
function mainMenu(){clearTimeout(policeTimer);grade=null;qs=[];tacos=0;qi=0;upgradeLevels=Array(20).fill(0);workersShop=false;workerLevels=Array(10).fill(0);admin=false;done=false;policeActive=false;btc=0;btcCash=1000;btcPrice=50000;btcHistory=[50000];lastTax=Date.now();document.getElementById('subtitle').textContent='Choose your grade, answer math questions, earn tacos, buy upgrades, and build your taco empire!';render()}
function reset(){mainMenu()}
render();setInterval(()=>{if(!done&&passiveRate()>0){tacos+=passiveRate();if(tacos>=goal){tacos=goal;done=true;confetti(100)}render()}taxes();updateTimer()},1000);setInterval(()=>{if(done)return;btcPrice=Math.max(1000,btcPrice*(1+(Math.random()-.5)*0.04));btcHistory.push(btcPrice);if(btcHistory.length>20)btcHistory.shift();render()},5000);
})();
</script></body></html>
